<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المعلم - رصد الدرجات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 5px; width: 100%; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #218838; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #007bff; color: white; }
        .delete-btn { background-color: #dc3545; padding: 5px 10px; font-size: 14px; }
        .delete-btn:hover { background-color: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة تحكم المعلم - رصد درجات الطلاب</h2>
    
    <div class="form-group">
        <label>اسم الأستاذ:</label>
        <input type="text" id="teacherName" placeholder="أدخل اسمك الكريم">
    </div>

    <div class="form-group">
        <label>المادة الدراسية:</label>
        <input type="text" id="subjectName" placeholder="مثال: الرياضيات">
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <div class="form-group">
        <label>اسم الطالب:</label>
        <input type="text" id="studentName" placeholder="أدخل اسم الطالب الكامل">
    </div>

    <div class="form-group">
        <label>رقم القيد (الرقم التعريفي):</label>
        <input type="text" id="studentId" placeholder="مثال: 1001">
    </div>

    <div class="form-group">
        <label>أعمال السنة:</label>
        <input type="number" id="courseWork" placeholder="من 40">
    </div>

    <div class="form-group">
        <label>الامتحان النهائي:</label>
        <input type="number" id="finalExam" placeholder="من 60">
    </div>

    <button onclick="saveGrade()">حفظ ورصد الدرجة سحابياً</button>

    <h3 style="margin-top: 30px;">الطلاب المسجلون سحابياً:</h3>
    <table>
        <thead>
            <tr>
                <th>رقم القيد</th>
                <th>اسم الطالب</th>
                <th>المادة</th>
                <th>المجموع</th>
                <th>إجراء</th>
            </tr>
        </thead>
        <tbody id="gradesTableBody">
            <!-- سيتم تعبئتها تلقائياً من قاعدة البيانات -->
        </tbody>
    </table>
</div>

<!-- ربط فايربيس (Firebase SDKs) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // إعدادات مشروعك السحابي من فايربيس
    const firebaseConfig = {
      apiKey: "AIzaSyAkKRCEo0GUEdLQ94LUD18ctn2oJX6CNZM",
      authDomain: "schoolgrades-9a12b.firebaseapp.com",
      projectId: "schoolgrades-9a12b",
      storageBucket: "schoolgrades-9a12b.firebasestorage.app",
      messagingSenderId: "661700240078",
      appId: "1:661700240078:web:c90746f008dc468b22269f",
      measurementId: "G-VYPC1L17JD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.saveGrade = async function() {
        const teacher = document.getElementById('teacherName').value;
        const subject = document.getElementById('subjectName').value;
        const name = document.getElementById('studentName').value;
        const id = document.getElementById('studentId').value;
        const coursework = parseFloat(document.getElementById('courseWork').value) || 0;
        const final = parseFloat(document.getElementById('finalExam').value) || 0;

        if(!name || !id || !subject) {
            alert("الرجاء إدخال اسم الطالب، رقم القيد، والمادة على الأقل!");
            return;
        }

        try {
            await addDoc(collection(db, "grades"), {
                teacherName: teacher,
                subjectName: subject,
                studentName: name,
                studentId: id,
                courseWork: coursework,
                finalExam: final,
                total: coursework + final
            });
            alert("تم حفظ ورصد الدرجة بنجاح في السحابة!");
            document.getElementById('studentName').value = '';
            document.getElementById('studentId').value = '';
            document.getElementById('courseWork').value = '';
            document.getElementById('finalExam').value = '';
            loadGrades();
        } catch (e) {
            alert("حدث خطأ أثناء الحفظ: " + e.message);
        }
    }

    async function loadGrades() {
        const tbody = document.getElementById('gradesTableBody');
        tbody.innerHTML = '';
        try {
            const querySnapshot = await getDocs(collection(db, "grades"));
            querySnapshot.forEach((documentSnapshot) => {
                let data = documentSnapshot.data();
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${data.studentId}</td>
                    <td>${data.studentName}</td>
                    <td>${data.subjectName || '-'}</td>
                    <td>${data.total}</td>
                    <td><button class="delete-btn" onclick="deleteRecord('${documentSnapshot.id}')">حذف</button></td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error("خطأ في جلب البيانات: ", e);
        }
    }

    window.deleteRecord = async function(docId) {
        if(confirm("هل أنت متأكد من حذف هذه الدرجة؟")) {
            await deleteDoc(doc(db, "grades", docId));
            loadGrades();
        }
    }

    window.onload = loadGrades;
</script>

</body>
</html>
