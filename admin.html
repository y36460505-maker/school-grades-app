<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأستاذ - رصد وإدارة الدرجات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 5px; width: 100%; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 10px; text-align: center; }
        th { background-color: #f2f2f2; }
        .btn-delete { background-color: #dc3545; color: white; padding: 5px 10px; border: none; border-radius: 3px; cursor: pointer; }
        .btn-delete:hover { background-color: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 لوحة تحكم الأستاذ المخصصة</h2>
    
    <div class="form-group">
        <label>اسم الأستاذ:</label>
        <input type="text" id="teacherName" placeholder="أدخل اسمك الكريم">
    </div>

    <div class="form-group">
        <label>اسم المادة التي تدرسها:</label>
        <input type="text" id="subjectName" placeholder="مثال: رياضيات، لغة عربية...">
    </div>

    <div class="form-group">
        <label>اسم الطالب الجديد:</label>
        <input type="text" id="studentName" placeholder="أدخل اسم الطالب الكامل">
    </div>

    <div class="form-group">
        <label>رقم قيد الطالب (كلمة المرور الخاصة به):</label>
        <input type="text" id="studentID" placeholder="أدخل رقم القيد أو الرقم التعريفي">
    </div>

    <div class="form-group">
        <label>أعمال السنة (من 40):</label>
        <input type="number" id="courseWork" min="0" max="40" placeholder="أدخل درجة أعمال السنة">
    </div>

    <div class="form-group">
        <label>الامتحان النهائي (من 60):</label>
        <input type="number" id="finalExam" min="0" max="60" placeholder="أدخل درجة الامتحان النهائي">
    </div>

    <button onclick="saveGrade()">حفظ ورصد الدرجة</button>

    <h3>📋 سجل درجات الطلاب في مادتك</h3>
    <table>
        <thead>
            <tr>
                <th>اسم الطالب</th>
                <th>رقم القيد</th>
                <th>أعمال السنة</th>
                <th>النهائي</th>
                <th>المجموع (من 100)</th>
                <th>إجراء</th>
            </tr>
        </thead>
        <tbody id="gradesTableBody">
            <!-- سيتم تعبئة البيانات تلقائياً -->
        </tbody>
    </table>
</div>

<script>
    document.addEventListener("DOMContentLoaded", loadGrades);

    function saveGrade() {
        const teacher = document.getElementById('teacherName').value;
        const subject = document.getElementById('subjectName').value;
        const sName = document.getElementById('studentName').value;
        const sID = document.getElementById('studentID').value;
        const cWork = parseFloat(document.getElementById('courseWork').value) || 0;
        const fExam = parseFloat(document.getElementById('finalExam').value) || 0;

        if (!teacher || !subject || !sName || !sID) {
            alert('الرجاء إكمال جميع البيانات الأساسية (اسم الأستاذ، المادة، اسم الطالب، ورقم القيد)');
            return;
        }

        let grades = JSON.parse(localStorage.getItem('schoolGrades')) || [];
        
        // التحقق إذا كان الطالب موجود مسبقاً لتحديث درجته أو إضافته
        grades.push({
            teacher: teacher,
            subject: subject,
            name: sName,
            id: sID,
            courseWork: cWork,
            finalExam: fExam,
            total: cWork + fExam
        });

        localStorage.setItem('schoolGrades', JSON.stringify(grades));
        alert('تم حفظ ورصد الدرجة بنجاح!');
        
        // تفريغ حقول الطالب فقط لإدخال طالب آخر
        document.getElementById('studentName').value = '';
        document.getElementById('studentID').value = '';
        document.getElementById('courseWork').value = '';
        document.getElementById('finalExam').value = '';

        loadGrades();
    }

    function loadGrades() {
        let grades = JSON.parse(localStorage.getItem('schoolGrades')) || [];
        let tbody = document.getElementById('gradesTableBody');
        tbody.innerHTML = '';

        grades.forEach((item, index) => {
            let row = `<tr>
                <td>${item.name}</td>
                <td>${item.id}</td>
                <td>${item.courseWork}</td>
                <td>${item.finalExam}</td>
                <td><b>${item.total}</b></td>
                <td><button class="btn-delete" onclick="deleteGrade(${index})">حذف</button></td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    function deleteGrade(index) {
        let grades = JSON.parse(localStorage.getItem('schoolGrades')) || [];
        grades.splice(index, 1);
        localStorage.setItem('schoolGrades', JSON.stringify(grades));
        loadGrades();
    }
</script>

</body>
</html>
