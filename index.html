<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة نتائج الطلاب الشاملة</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #e9ecef; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 12px; border: none; border-radius: 5px; width: 100%; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #resultBox { margin-top: 20px; padding: 15px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 5px; display: none; }
        .error { color: red; text-align: center; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎓 بوابة نتائج الطلاب الشاملة</h2>
    
    <div class="form-group">
        <label>أدخل اسمك الثلاثي:</label>
        <input type="text" id="studentSearchName" placeholder="اكتب اسمك تماماً كما أدخله الأستاذ">
    </div>

    <div class="form-group">
        <label>أدخل رقم القيد (كلمة المرور):</label>
        <input type="password" id="studentSearchID" placeholder="رقم القيد الخاص بك">
    </div>

    <button onclick="searchResult()">عرض كشف الدرجات</button>

    <div id="resultBox">
        <h3>نتيجة الطالب: <span id="resName"></span></h3>
        <p><b>المادة:</b> <span id="resSubject"></span></p>
        <p><b>الأستاذ:</b> <span id="resTeacher"></span></p>
        <p><b>أعمال السنة (من 40):</b> <span id="resCW"></span></p>
        <p><b>الامتحان النهائي (من 60):</b> <span id="resFE"></span></p>
        <p><b>المجموع النهائي (من 100):</b> <span id="resTotal" style="color: green; font-weight: bold;"></span></p>
    </div>

    <div id="errorMsg" class="error"></div>
</div>

<script>
    function searchResult() {
        const sName = document.getElementById('studentSearchName').value.trim();
        const sID = document.getElementById('studentSearchID').value.trim();
        const resultBox = document.getElementById('resultBox');
        const errorMsg = document.getElementById('errorMsg');

        resultBox.style.display = 'none';
        errorMsg.innerHTML = '';

        if (!sName || !sID) {
            errorMsg.innerHTML = 'الرجاء إدخال الاسم ورقم القيد بشكل صحيح.';
            return;
        }

        let grades = JSON.parse(localStorage.getItem('schoolGrades')) || [];
        
        // البحث عن الطالب بالاسم ورقم القيد
        const student = grades.find(item => item.name === sName && item.id === sID);

        if (student) {
            document.getElementById('resName').innerText = student.name;
            document.getElementById('resSubject').innerText = student.subject;
            document.getElementById('resTeacher').innerText = student.teacher;
            document.getElementById('resCW').innerText = student.courseWork;
            document.getElementById('resFE').innerText = student.finalExam;
            document.getElementById('resTotal').innerText = student.total;

            resultBox.style.display = 'block';
        } else {
            errorMsg.innerHTML = 'عذراً، لم يتم العثور على نتيجة بهذا الاسم أو رقم القيد خاطئ، أو لم يتم رصد الدرجة بعد.';
        }
    }
</script>

</body>
</html>
